[package]
name = "acktor"
version = "1.0.0"
description = "Pure-Rust Actor Framework Built on Tokio Runtime"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
exclude = ["examples/*", "tests/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
derive = ["dep:acktor-derive"]
# this feature requires `tokio_unstable` flag
tokio-tracing = ["tokio/tracing"]
bottleneck-warning = []

[dependencies]
futures-util = "0.3"
rustc-hash = "2.1"
tokio = { version = "1.37", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

acktor-derive = { workspace = true, optional = true }
acktor-macros = { workspace = true }

[dev-dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pretty_assertions = "1.4"
