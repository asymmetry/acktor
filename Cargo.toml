[workspace]
resolver = "2"
members = ["acktor", "acktor-derive", "acktor-ipc", "acktor-ipc-proto"]
exclude = ["ipc-proto-gen"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Chao Gu"]
license = "MIT"
repository = "https://github.com/asymmetry/acktor"
categories = ["asynchronous"]
keywords = ["actor", "async"]

[workspace.dependencies]
acktor = { version = "1.0", path = "./acktor", default-features = false }
acktor-derive = { version = "1.0", path = "./acktor-derive" }
acktor-ipc = { version = "0.1", path = "./acktor-ipc" }
acktor-ipc-proto = { version = "0.1", path = "./acktor-ipc-proto" }
