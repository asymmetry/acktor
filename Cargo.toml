[workspace]
members = ["acktor", "acktor-derive", "acktor-ipc", "acktor-ipc-proto"]
exclude = ["ipc-proto-gen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Chao Gu"]
license = "MIT"
repository = "https://github.com/asymmetry/acktor"
categories = ["asynchronous"]
keywords = ["actor", "async"]

[workspace.dependencies]
# dependencies
ahash = "0.8"
bytes = "1.10"
crossbeam-channel = "0.5"
dashmap = "6.1"
disqualified = "=1.0.0"
futures-util = "0.3"
interprocess = { version = "2.2", features = ["tokio"] }
prost = "0.14"
sha2-const = "0.1"
thiserror = "2.0"
tokio = "1.47"
tokio-tungstenite = "0.29"
tokio-util = "0.7"
tracing = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }

# dev-dependencies
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
pretty_assertions = "1.4"
rkyv = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1.0"

# workspace
acktor = { version = "1.1", path = "./acktor", default-features = false }
acktor-derive = { version = "1.1", path = "./acktor-derive", default-features = false }
acktor-ipc = { version = "1.1", path = "./acktor-ipc", default-features = false }
acktor-ipc-proto = { version = "1.1", path = "./acktor-ipc-proto", default-features = false }
