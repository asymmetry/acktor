name: Publish

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: dry run publish acktor-macros
        run: cargo publish -p acktor-macros --dry-run
      - name: dry run publish acktor-derive
        run: cargo publish -p acktor-derive --dry-run
      - name: dry run publish acktor
        run: cargo publish -p acktor --dry-run
      - name: publish acktor-macros
        run: |
          output=$(cargo publish -p acktor-macros 2>&1) || {
            if echo "$output" | grep -q "already exists"; then
              echo "acktor-macros version already published, skipping"
            else
              echo "$output"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: publish acktor-derive
        run: |
          output=$(cargo publish -p acktor-derive 2>&1) || {
            if echo "$output" | grep -q "already exists"; then
              echo "acktor-derive version already published, skipping"
            else
              echo "$output"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: publish acktor
        run: cargo publish -p acktor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
