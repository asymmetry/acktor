syntax = "proto3";

package actor_message;

// A message which is used to send a message to a remote actor and wait for a response.
// The remote actor should response with the given tag.
message Send {
  // The index of the recipient actor in the remote process.
  uint64 actor_id = 1;
  // The message to be sent.
  bytes message = 2;
  // The tag to be used in the reply.
  uint64 tag = 3;
}

// A message which is used to send a message to a remote actor without expecting a
// response.
message DoSend {
  // The index of the recipient actor in the remote process.
  uint64 actor_id = 1;
  // The message to be sent.
  bytes message = 2;
}

// A message which is used to reply to a message sent by `Send` command.
//
// `result` carries either the successfully-encoded `M::Result` bytes, or a
// handler-side error reason (e.g. the target actor could not be found).
message Reply {
  // The tag of the message to be replied.
  uint64 tag = 1;
  // The result of the command.
  oneof result {
    // The encoded response payload.
    bytes ok = 2;
    // The error reason.
    string err = 3;
  }
}

// A message which is used to communicate with remote actors.
message ActorMessage {
  oneof message {
    // Sends a message to a remote actor and wait for a response.
    Send send = 1;
    // Sends a message to a remote actor without expecting a response.
    DoSend do_send = 2;
    // Replies to a message sent by `Send` command.
    Reply reply = 3;
  }
}
