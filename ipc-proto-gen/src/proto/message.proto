syntax = "proto3";

import "node_message.proto";

package message;

// IPC message.
message IpcMessage {
  oneof message {
    // A message which is used to communicate with remote actors.
    ActorMessage actor_message = 1;
    // A message which is used to communicate with remote nodes directly.
    node_message.NodeMessage node_message = 2;
    // A message which is used as the response of an `ActorMessage` or an `NodeMessage`.
    MessageResponse message_response = 3;
  }
}

// A message which is used to send a message to an actor in the remote node.
//
// It can not be used to send a message to the remote node itself, use `NodeMessage` instead.
message ActorMessage {
  // The index of the target actor in the remote node.
  uint64 actor_id = 1;
  // The message identifier of the message to be sent.
  fixed64 message_id = 2;
  // The message to be sent.
  bytes message = 3;
  // The tag to be used in the message response.
  optional uint64 tag = 4;
}

// A message which is used as the response of an `ActorMessage` or an `NodeMessage`.
message MessageResponse {
  // The tag of the message.
  uint64 tag = 1;
  // The response of the message. If the message is successfully handled by the target actor,
  // the `ok` field will be set to the response of the message; otherwise, the `err` field will
  // be set to the error message.
  //
  // Note that a message is considered to be successfully handled by the target actor if the
  // message handler properly returns a value matches the `Message::Result` type, even if this
  // value itself is a `Result` and is a `Result::Err` variant.
  //
  // The `err` field here is only used to report errors that causes the message not able to be
  // handled by the target actor. For example, if a message's response type is `()`, but it failed
  // to be decoded by the target actor, the `err` field will be set to the error message of the
  // `DecodeError`.
  oneof response {
    // The response of the message.
    bytes ok = 2;
    // The error message.
    string err = 3;
  }
}
