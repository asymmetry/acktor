[package]
name = "acktor-ipc"
version = "1.1.2"
description = "Interprocess communication support for the acktor actor framework"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
exclude = ["examples/*", "tests/*"]

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "tokio_unstable"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["derive"]
derive = ["dep:acktor-derive", "acktor/derive"]
# pre-implemented IPC methods
# enable below features to pick the IPC transport(s) you want
pipe = [
    "dep:interprocess",
    "dep:tokio-util",
    "futures-util/sink",
    "tokio/io-util",
]
websocket = ["dep:tokio-tungstenite", "tokio/net"]

[dependencies]
ahash.workspace = true
bytes.workspace = true
dashmap.workspace = true
futures-util.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing.workspace = true
zerocopy.workspace = true

interprocess = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }

acktor = { workspace = true, default-features = false, features = [
    "cron",
    "ipc",
    "observer",
] }
acktor-ipc-proto = { workspace = true }

acktor-derive = { workspace = true, optional = true, features = ["ipc"] }

[dev-dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"] }
tracing-subscriber.workspace = true
tracing-test.workspace = true

[[example]]
name = "pingpong"
required-features = ["derive", "websocket"]

[[test]]
name = "test_basic"
required-features = ["pipe", "websocket"]

[[test]]
name = "test_node"
required-features = ["derive", "websocket"]

[[test]]
name = "test_remote_address"
required-features = ["derive", "websocket"]

[[test]]
name = "test_remote_spawnable"
required-features = ["derive", "websocket"]
