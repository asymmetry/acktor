coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 5%

ignore:
  # test utilities
  - "**/test_utils.*"
  # protocol buffer generated code and ctors
  - "acktor-ipc-proto"
  # protocol buffer code generator
  - "ipc-proto-gen"
